# Server configuration
server.port=8082

# MySQL Database configuration (Connecting directly to cars_db)
spring.datasource.url=jdbc:mysql://localhost:3306/cars_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Automatic Migration / Initialization (schema.sql & data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Spring Data REST: only publish repositories annotated with @RepositoryRestResource.
# Without this, CarRepository would also appear at /cars and bypass the controller.
spring.data.rest.detection-strategy=annotated

# Local settings from .env at the repo root (see .env.example). Real environment variables win over it.
# The first path works when started from this folder, the second when started from the repo root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Key that signs and checks login tokens: must be the same in users_proj and cars_proj.
jwt.secret=${JWT_SECRET:carhub-local-development-only-secret-key}
