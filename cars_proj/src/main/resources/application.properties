# Server configuration
server.port=8082

# MySQL Database configuration (Docker mysql_db container)
spring.datasource.url=jdbc:mysql://localhost:3306/cars_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Automatic Migration / Initialization (schema.sql & data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
