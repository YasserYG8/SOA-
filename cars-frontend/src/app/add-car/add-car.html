<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Add New Car</h1>
      <p class="text-sm text-slate-500 mt-1">Fill in the technical details, photo URL, and associate a manufacturer brand.</p>
    </div>
    <a routerLink="/cars" class="inline-flex items-center text-sm font-medium text-slate-600 hover:text-slate-900">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Inventory
    </a>
  </div>

  <!-- Success Alert -->
  <div *ngIf="message" class="mb-6 p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 flex items-center gap-3">
    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span class="font-medium text-sm">{{ message }}</span>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
    <form (ngSubmit)="addCar()" #carForm="ngForm" class="space-y-6">

      <!-- Model Name -->
      <div>
        <label for="model" class="block text-sm font-semibold text-slate-700 mb-1">
          Model Name <span class="text-rose-500">*</span>
        </label>
        <input type="text"
               id="model"
               name="model"
               [(ngModel)]="newCar.model"
               required
               #modelRef="ngModel"
               placeholder="e.g. M4 Competition, RS6 Avant, 911 GT3"
               class="w-full px-4 py-2.5 border rounded-lg text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100"
               [ngClass]="modelRef.invalid && modelRef.touched ? 'border-rose-300 focus:border-rose-500' : 'border-slate-300 focus:border-blue-500'" />
        <p *ngIf="modelRef.invalid && modelRef.touched" class="mt-1 text-xs text-rose-500">
          Model name is required.
        </p>
      </div>

      <!-- Grid for Brand and Price -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

        <!-- Brand Select -->
        <div>
          <label for="brand" class="block text-sm font-semibold text-slate-700 mb-1">
            Manufacturer / Brand <span class="text-rose-500">*</span>
          </label>
          <select id="brand"
                  name="brandId"
                  [(ngModel)]="newIdBrand"
                  required
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            <option *ngFor="let b of brands" [ngValue]="b.idBrand">
              {{ b.name }} ({{ b.country }})
            </option>
          </select>
        </div>

        <!-- Price -->
        <div>
          <label for="price" class="block text-sm font-semibold text-slate-700 mb-1">
            Price (€ EUR) <span class="text-rose-500">*</span>
          </label>
          <input type="number"
                 id="price"
                 name="price"
                 [(ngModel)]="newCar.price"
                 required
                 min="0"
                 #priceRef="ngModel"
                 placeholder="e.g. 85000"
                 class="w-full px-4 py-2.5 border rounded-lg text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100"
                 [ngClass]="priceRef.invalid && priceRef.touched ? 'border-rose-300 focus:border-rose-500' : 'border-slate-300 focus:border-blue-500'" />
        </div>

      </div>

      <!-- Grid for Release Date and License Plate -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

        <!-- Release Date -->
        <div>
          <label for="releaseDate" class="block text-sm font-semibold text-slate-700 mb-1">
            Release Date <span class="text-rose-500">*</span>
          </label>
          <input type="date"
                 id="releaseDate"
                 name="releaseDate"
                 [(ngModel)]="newCar.releaseDate"
                 required
                 #dateRef="ngModel"
                 class="w-full px-4 py-2.5 border rounded-lg text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100"
                 [ngClass]="dateRef.invalid && dateRef.touched ? 'border-rose-300 focus:border-rose-500' : 'border-slate-300 focus:border-blue-500'" />
        </div>

        <!-- License Plate -->
        <div>
          <label for="licensePlate" class="block text-sm font-semibold text-slate-700 mb-1">
            License Plate <span class="text-rose-500">*</span>
          </label>
          <input type="text"
                 id="licensePlate"
                 name="licensePlate"
                 [(ngModel)]="newCar.licensePlate"
                 required
                 #plateRef="ngModel"
                 placeholder="e.g. 240-TUN-8888"
                 class="w-full px-4 py-2.5 border rounded-lg text-sm uppercase font-mono transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100"
                 [ngClass]="plateRef.invalid && plateRef.touched ? 'border-rose-300 focus:border-rose-500' : 'border-slate-300 focus:border-blue-500'" />
        </div>

      </div>

      <!-- Image URL & Live Preview -->
      <div class="space-y-3">
        <label for="imagePath" class="block text-sm font-semibold text-slate-700">
          Car Photo URL
        </label>
        <div class="flex flex-col sm:flex-row gap-4 items-start">
          <div class="flex-1 w-full">
            <input type="text"
                   id="imagePath"
                   name="imagePath"
                   [(ngModel)]="newCar.imagePath"
                   placeholder="https://images.unsplash.com/... or any web image link"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm transition-colors focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
            <p class="mt-1 text-xs text-slate-400">Leave blank to use the default high-performance sports car photo.</p>
          </div>
          <!-- Live Preview Box -->
          <div class="w-full sm:w-36 h-24 rounded-lg border border-slate-200 bg-slate-50 overflow-hidden flex items-center justify-center shrink-0">
            <img [src]="newCar.imagePath || fallbackImage"
                 (error)="onImageError($event)"
                 alt="Preview"
                 class="w-full h-full object-cover" />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
        <a routerLink="/cars"
           class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
          Cancel
        </a>
        <button type="submit"
                [disabled]="carForm.invalid"
                class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg shadow-sm hover:shadow transition-all duration-200 focus:ring-4 focus:ring-blue-100">
          Save Car
        </button>
      </div>

    </form>
  </div>

</div>
