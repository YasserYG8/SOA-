<div class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

  <!-- Navbar -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-50 shadow-sm backdrop-blur-md bg-white/95">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">

        <!-- Logo & Brand -->
        <div class="flex items-center gap-3">
          <a routerLink="/cars" class="flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform duration-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
              </svg>
            </div>
            <div>
              <span class="text-lg font-bold bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">CarHub</span>
              <span class="ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200">Sprint 01</span>
            </div>
          </a>
        </div>

        <!-- Navigation Links -->
        <nav class="flex items-center gap-1 sm:gap-2">
          <a routerLink="/cars"
             routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
             [routerLinkActiveOptions]="{exact: true}"
             class="px-3.5 py-2 rounded-lg text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
            Cars Fleet
          </a>
          <a routerLink="/add-car"
             routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
             class="px-3.5 py-2 rounded-lg text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
            + New Car
          </a>
        </nav>

        <!-- Backend Status Indicator -->
        <div class="hidden md:flex items-center gap-2 text-xs text-slate-500 font-medium">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span>API Connected (Port 8082)</span>
        </div>

      </div>
    </div>
  </header>

  <!-- Main View -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p>© 2026 CarHub Fullstack — Spring Boot 3 + Angular + MySQL Docker</p>
      <p class="font-medium text-slate-600">Sprint 01 Architecture: Entities, Repositories, REST API & Tailwind UI</p>
    </div>
  </footer>

</div>
