<div class="bg-white rounded-2xl border border-slate-200/80 p-6">
  <h2 class="text-lg font-bold text-slate-900 mb-4">{{ add ? 'Add a brand' : 'Edit brand #' + brand.idBrand }}</h2>
  <form (ngSubmit)="saveBrand()" #brandForm="ngForm" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div>
      <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Name <span class="text-rose-500">*</span></label>
      <input id="name" name="name" type="text" required [(ngModel)]="brand.name"
             class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
    </div>
    <div>
      <label for="country" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Country</label>
      <input id="country" name="country" type="text" [(ngModel)]="brand.country"
             class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
    </div>
    <div>
      <label for="description" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Description</label>
      <input id="description" name="description" type="text" [(ngModel)]="brand.description"
             class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400 focus:ring-4 focus:ring-slate-100" />
    </div>
    <div class="sm:col-span-3 flex justify-end">
      <button type="submit" [disabled]="brandForm.invalid"
              class="px-6 py-2.5 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl transition-colors">
        {{ add ? 'Add Brand' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
