services:
  mysql:
    image: mysql:8.4
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: cars_db
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

configs:
  init_sql:
    content: |
      CREATE USER IF NOT EXISTS 'yasser'@'%' IDENTIFIED BY '';
      GRANT ALL PRIVILEGES ON cars_db.* TO 'yasser'@'%';
      FLUSH PRIVILEGES;

volumes:
  mysql_data: